[project]
name = "plagiarism-checker"
version = "0.1.0"
description = "Plagiarism checker website"
readme = "README.md"
authors = [
    { name = "Alexander", email = "patcharapol.pantawee@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "flask>=3.1.3",
    "fpdf2>=2.9.0",
]

[project.scripts]
plagiarism-checker = "plagiarism_checker:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.vercel]
entrypoint = "plagiarism_checker:app"

[tool.vercel.scripts]
# Vercel serves public/ from its CDN; Flask's static_folder is not used there
build = "cd web && bun install --frozen-lockfile && bun run build && rm -rf ../public && cp -r dist ../public"
