<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plagiarism Checker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5" style="max-width: 640px">
    <h1 class="mb-4">Plagiarism Checker</h1>

    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    {% if filename %}<div class="alert alert-success" role="status">Received {{ filename }} ({{ chars }} characters).</div>{% endif %}

    <form method="post" enctype="multipart/form-data">
      <div class="mb-3">
        <label for="document" class="form-label">Document (.txt, max 2 MB)</label>
        <input class="form-control" type="file" id="document" name="document" accept=".txt" required>
      </div>
      <button class="btn btn-primary" type="submit">Check</button>
    </form>
  </main>
</body>
</html>
